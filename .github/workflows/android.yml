name: Build Android APK Online

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Fix Missing Configurations
      run: |
        # জিপ ফাইল আনজিপ করা
        unzip CarromPracticeAimTrainer.zip -d extracted_source
        SUBFOLDER=$(find extracted_source -maxdepth 1 -minimum-depth 1 -type d | head -n 1)
        if [ -n "$SUBFOLDER" ]; then
          mv "$SUBFOLDER"/* . 2>/dev/null || true
          mv "$SUBFOLDER"/.* . 2>/dev/null || true
        else
          mv extracted_source/* . 2>/dev/null || true
          mv extracted_source/.* . 2>/dev/null || true
        fi
        
        # খালি settings.gradle ফাইলটিতে প্রয়োজনীয় কোড অটোমেটিক বসানো
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "CarromPracticeAimTrainer"
        include ':app'
        EOF

        # খালি build.gradle ফাইলটিতে প্রয়োজনীয় কোড অটোমেটিক বসানো
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.0.2' apply false
            id 'com.android.library' version '8.0.2' apply false
        }
        EOF

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.0.2

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyCarromApp
        path: "**/build/outputs/apk/debug/*.apk"
