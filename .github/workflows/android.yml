name: Build Android APK Online

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Source Code
      run: |
        unzip CarromPracticeAimTrainer.zip -d extracted_source
        SUBFOLDER=$(find extracted_source -maxdepth 1 -minimum-depth 1 -type d | head -n 1)
        if [ -n "$SUBFOLDER" ]; then
          mv "$SUBFOLDER"/* . 2>/dev/null || true
          mv "$SUBFOLDER"/.* . 2>/dev/null || true
        else
          mv extracted_source/* . 2>/dev/null || true
          mv extracted_source/.* . 2>/dev/null || true
        fi

    - name: Force Generate Missing Gradle Wrapper
      run: |
        # ফাইল ক্লাশ এড়াতে ফোর্সফুলি বা ওভাররাইট মোডে জেনারেট করা
        gradle wrapper --gradle-version 8.0 --validate-url

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyCarromApp
        path: "**/build/outputs/apk/debug/*.apk"
